<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneDash</title>

    <!-- Preconnect to API origin so DNS+TLS is ready before first request -->
    <link rel="preconnect" href="https://api.onedash.cloud" crossorigin>
    <link rel="dns-prefetch" href="https://api.onedash.cloud">

    <!--
      GOOGLE FONTS — Non-render-blocking via preload + media swap.
      Loads Inter (core UI font) and Outfit (headings/theme font) with display=swap.
    -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600&display=swap"></noscript>

    <!-- Razorpay SDK loaded dynamically only on Checkout/Payment pages -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
